name: JANAPAD USER Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}" || test -d /usr/local/lib/android/sdk
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - name: Build Debug APK
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: Gradle wrapper (gradlew) is missing from repository root."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JANAPAD-USER-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
